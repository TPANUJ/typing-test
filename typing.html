<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing test</title>
</head>
<link rel="stylesheet" href="typing.css">
<body>
  <div class="container">
  <h1 class="heading">Check Your Speed and Accuracy</h1>

  <p class="speed">Timer</p>

  <div class="para" id="paragraph">
    Click "Generate" to get a paragraph then "start" will enable
  </div>

  <div class="controls">
    <button type="button" onclick="randomPara()">Generate</button>
    <button type="button" id="start" onclick="starttimer()" >Start Test</button>
  </div>

  <input
    type="text"
    id="input"
    placeholder="Click start to type"
    autocomplete="off"
    
  >
</div>

    
    <script src="typing.js"></script>
</body>
</html>
